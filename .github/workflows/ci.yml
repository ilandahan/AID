# CI: runs the repo's own tests and supply-chain checks on every push and PR.
# - Read-only token, checkout credentials are not persisted.
# - Every action is pinned to a full commit SHA (tag in the trailing comment).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (testing/e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Run tests with a throwaway home
        run: |
          FH="$(mktemp -d)"
          HOME="$FH" USERPROFILE="$FH" AID_HOME="$FH/.aid" python -m pytest testing/e2e -q -p no:cacheprovider
      - name: Run memory-system unit tests with a throwaway home
        working-directory: memory-system
        run: |
          FH="$(mktemp -d)"
          HOME="$FH" USERPROFILE="$FH" AID_HOME="$FH/.aid" python -m pytest -q -p no:cacheprovider

  node-test:
    name: node --test (pipeline-orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test
        working-directory: skills/pipeline-orchestrator

  pip-audit:
    name: pip-audit (CI Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # T17-37 (U-01): the audit tool itself is hash-pinned; it audits the hashed CI pins
      # without installing or resolving them.
      - run: python -m pip install --require-hashes -r .github/requirements-audit.txt
      - name: Audit .github/requirements-ci.txt
        run: python -m pip_audit --strict --require-hashes --disable-pip -r .github/requirements-ci.txt

  gitleaks:
    name: gitleaks (full history, redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (sha256-verified release binary)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  npm-audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: cucumber smoke profile on an empty health root (T15-43)
        run: |
          HR="$(mktemp -d)"
          AID_HEALTH_ROOT="$HR" npx --no-install cucumber-js --profile smoke
      - name: npm audit (high) in storybook-preview
        working-directory: storybook-preview
        run: npm audit --audit-level=high

  version-bump:
    name: version bump guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Shipped files changed since the last v* tag (or origin/main) need a new plugin.json version
        run: |
          paths="hooks agents agent-assets commands skills rules references integrations memory-system scripts .claude-plugin CLAUDE.md"
          version="$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            base="$tag"
            base_version="${tag#v}"
          else
            # A-24: with no v* tag yet, compare against origin/main's plugin.json version
            # instead of skipping, so the guard can fire before the first release tag.
            base="origin/main"
            if ! git rev-parse --verify -q "$base" >/dev/null; then
              echo "::notice::no v* tag and no origin/main; version bump guard skipped"
              exit 0
            fi
            base_version="$(git show "$base:.claude-plugin/plugin.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" || base_version=""
            if [ -z "$base_version" ]; then
              echo "::error::cannot read the plugin.json version at $base"
              exit 1
            fi
          fi
          # shellcheck disable=SC2086
          shipped="$(git diff --name-only "$base" HEAD -- $paths)"
          if [ -n "$shipped" ] && [ "$version" = "$base_version" ]; then
            echo "::error::shipped files changed since $base but plugin.json version is still $version; bump it"
            echo "$shipped"
            exit 1
          fi
          echo "version guard ok (base $base at $base_version, plugin.json $version)"

  windows-scripts:
    name: init-project.sh under Git Bash (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Run testing/e2e/test_t15_scripts.py with a throwaway home
        run: |
          FH="$(mktemp -d)"
          HOME="$FH" USERPROFILE="$FH" AID_HOME="$FH/.aid" python -m pytest testing/e2e/test_t15_scripts.py -q -p no:cacheprovider
