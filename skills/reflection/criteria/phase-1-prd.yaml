# Phase 1: PRD - Reflection Criteria
# Product Requirements Document phase

phase: 1
name: "PRD"
description: "Requirements, user stories, acceptance criteria, scope definition"

criteria:
  - id: why_alignment
    name: "WHY Alignment"
    weight: 3
    checks:
      - "Does every requirement trace back to user/business need?"
      - "Is the WHY explicitly stated for each feature?"
      - "Are we solving the validated problem from Discovery?"
    scoring:
      excellent: "Clear WHY traceability for all requirements"
      acceptable: "Most requirements have clear WHY"
      poor: "Features without clear purpose or need"

  - id: phase_compliance
    name: "Phase Compliance"
    weight: 2
    checks:
      - "Defining WHAT, not HOW?"
      - "Not making technical/architecture decisions?"
      - "Not writing code or pseudocode?"
    scoring:
      excellent: "Pure requirements, no implementation details"
      acceptable: "Mostly requirements with minor tech hints"
      poor: "Contains architecture decisions or code"

  - id: correctness
    name: "Requirements Quality"
    weight: 3
    checks:
      - "User stories follow who/what/why format?"
      - "Acceptance criteria are testable and measurable?"
      - "Requirements are unambiguous?"
      - "No conflicting requirements?"
    scoring:
      excellent: "Clear, testable, unambiguous requirements"
      acceptable: "Good requirements with minor clarity issues"
      poor: "Vague, untestable, or conflicting requirements"

  - id: security
    name: "Security Requirements"
    weight: 2
    checks:
      - "Security requirements explicitly defined?"
      - "Data privacy considerations included?"
      - "Authentication/authorization needs specified?"
    scoring:
      excellent: "Comprehensive security requirements"
      acceptable: "Basic security requirements present"
      poor: "Security requirements missing or incomplete"

  - id: completeness
    name: "Scope Coverage"
    weight: 2
    checks:
      - "All user personas covered?"
      - "Happy path and error scenarios defined?"
      - "Edge cases identified?"
      - "Out of scope clearly stated?"
    scoring:
      excellent: "Complete coverage with clear boundaries"
      acceptable: "Main scenarios covered, some gaps"
      poor: "Major scenarios or personas missing"

  - id: agentic_design
    name: "Solution Shape & Agentic Design (Agentic Layer)"
    weight: 3
    checks:
      - "§1.5 Solution Shape picks a ladder level (0-5) and justifies every step up in one sentence?"
      - "Level 5 (Multi-agent) only with one of the 4 justifications (separate permission boundaries, contaminating contexts, genuinely parallel work, different owning teams)?"
      - "§7A.1 Charter, 7A.2 Tools & Permissions, 7A.3 Context & Data, 7A.4 Failure Modes & Guardrails, 7A.5 Why-Chain, 7A.6 Eval Plan, 7A.7 Telemetry & Traces, 7A.8 Rollout & Kill Switch all present, none \"N/A\"?"
      - "7A.5 Why-Chain complete: every WHY row has a requirement, an eval and a metric?"
      - "§1.4 metrics have North Star / supporting / guardrail, with at least one guardrail metric?"
      - "Scaled to the §1.5 level tier (0-1, 2-3, 4-5)? Never \"N/A\". At levels 0-1 a one-line cross-reference to where it is already covered (e.g. \"7A.6: covered by §4 Gherkin ACs + negative tests\") is scored as fully met"
      - "WHY + shape brief present (docs/prd/WHY-SHAPE-BRIEF-<feature>.md): WHY statement, Why-Chain seeds, answers to the 6 shape questions, level hypothesis, error owner, never-do list, approvals?"
      - "Seed eval cases present (docs/prd/SEED-EVALS-<feature>.md): 20-30 cases, or a cross-reference at levels 0-1?"
      - "§1.5 level signed by the tech lead (ADR) after the shaping session?"
    scoring:
      excellent: "Justified level signed by the tech lead (ADR); WHY + shape brief and seed evals present; all eight §7A sections scaled to it; complete Why-Chain; guardrail metric defined"
      acceptable: "All sections, the brief and the seed evals present; minor gaps in scaling or Why-Chain rows"
      poor: "§1.5 or any §7A section missing or \"N/A\", Why-Chain incomplete, no guardrail metric, no WHY + shape brief, no seed evals, or the level not signed by the tech lead"

threshold: 7
max_iterations: 3

notes:
  borderline: "Review acceptance criteria for testability"
  improvement_focus:
    - "Add explicit WHY to each requirement"
    - "Make acceptance criteria measurable"
    - "Clarify scope boundaries"
